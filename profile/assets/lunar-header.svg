<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <radialGradient id="skyGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#181D28" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#090B10" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050608" stop-opacity="1"/>
    </radialGradient>

    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5D9EC" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#7B9BB8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="crescentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#D8E4F0"/>
      <stop offset="100%" stop-color="#7B93A8"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Deep Velvet Canvas -->
  <rect width="1000" height="280" rx="16" fill="url(#skyGlow)"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="500" cy="95" r="130" fill="url(#moonGlow)"/>

  <!-- Minimalist Crescent -->
  <g transform="translate(500, 92)">
    <!-- Faint Full Moon Silhouette -->
    <circle cx="0" cy="0" r="32" fill="#0C1017" stroke="#1E2736" stroke-width="0.75"/>
    
    <!-- Crisp Crescent -->
    <path d="M 0 -32 A 32 32 0 0 1 32 0 A 32 32 0 0 1 0 32 A 32 32 0 0 0 16 0 A 32 32 0 0 0 0 -32 Z" 
          fill="url(#crescentGrad)"/>
    
    <!-- Quiet Orbit Accent -->
    <ellipse cx="0" cy="0" rx="52" ry="14" fill="none" stroke="#607B96" stroke-width="0.75" stroke-dasharray="2 6" opacity="0.4" transform="rotate(-18)"/>
  </g>

  <!-- Fine Horizontal Rule -->
  <line x1="280" y1="172" x2="720" y2="172" stroke="url(#lineGrad)" stroke-width="1"/>

  <!-- Clean Typography -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', sans-serif">
    <!-- Title -->
    <text x="500" y="210" fill="#F4F6F8" font-size="20" font-weight="500" letter-spacing="10">
      THE LUNAR ORG
    </text>

    <!-- Subtitle -->
    <text x="500" y="238" fill="#717D8A" font-size="12" font-weight="400" letter-spacing="3">
      QUIET CRAFTSMANSHIP • BUILT TO LAST
    </text>
  </g>
</svg>
