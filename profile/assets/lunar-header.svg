<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="100%" height="100%">
  <defs>
    <!-- Needlemac-inspired atmospheric twilight sky -->
    <linearGradient id="twilightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141B29"/>
      <stop offset="35%" stop-color="#1A2436"/>
      <stop offset="70%" stop-color="#161C28"/>
      <stop offset="100%" stop-color="#0E121A"/>
    </linearGradient>

    <!-- Warm atmospheric horizon haze -->
    <radialGradient id="horizonGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#8EABC9" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#597799" stop-opacity="0.10"/>
      <stop offset="70%" stop-color="#2D3A4D" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0E121A" stop-opacity="0"/>
    </radialGradient>

    <!-- Luminous moon orb -->
    <radialGradient id="lunarOrb" cx="38%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#EDF4FA"/>
      <stop offset="65%" stop-color="#B8CCE0"/>
      <stop offset="90%" stop-color="#6F88A3"/>
      <stop offset="100%" stop-color="#3A4D61"/>
    </radialGradient>

    <!-- Moon aura glow -->
    <radialGradient id="lunarAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EDF4FA" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#A4C2E0" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#5A7D9F" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#1A2436" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft border line -->
    <linearGradient id="softBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Grain / starlight filter -->
    <filter id="gentleBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <style>
    .title-serif {
      font-family: "Instrument Serif", "Georgia", "Baskerville", "Times New Roman", serif;
      font-style: italic;
      font-size: 48px;
      fill: #F2F5F8;
      letter-spacing: 0.5px;
    }
    .tagline-sans {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", sans-serif;
      font-size: 13px;
      font-weight: 400;
      fill: #8D9FAF;
      letter-spacing: 3.5px;
      text-transform: uppercase;
    }
    .motto-serif {
      font-family: "Instrument Serif", "Georgia", "Times New Roman", serif;
      font-style: italic;
      font-size: 16px;
      fill: #A7B8C7;
      letter-spacing: 0.2px;
    }
  </style>

  <!-- Sky Canvas -->
  <rect width="1100" height="360" rx="20" fill="url(#twilightSky)"/>

  <!-- Atmosphere Glow -->
  <rect width="1100" height="360" rx="20" fill="url(#horizonGlow)"/>

  <!-- Subtle Rim Light -->
  <rect width="1100" height="360" rx="20" fill="none" stroke="url(#softBorder)" stroke-width="1.2"/>

  <!-- Quiet distant stars -->
  <g fill="#DCE7F2" opacity="0.45">
    <circle cx="160" cy="70" r="1.2"/>
    <circle cx="280" cy="110" r="1"/>
    <circle cx="390" cy="50" r="1.4" opacity="0.6"/>
    <circle cx="710" cy="65" r="1"/>
    <circle cx="840" cy="100" r="1.5" opacity="0.7"/>
    <circle cx="960" cy="55" r="1"/>
    <circle cx="210" cy="270" r="1.2"/>
    <circle cx="890" cy="280" r="1.4" opacity="0.5"/>
  </g>

  <!-- Serene Moon & Aura -->
  <g transform="translate(550, 115)">
    <!-- Diffuse Ambient Aura -->
    <circle cx="0" cy="0" r="95" fill="url(#lunarAura)"/>
    
    <!-- Fine Orbital Trace -->
    <circle cx="0" cy="0" r="58" fill="none" stroke="#68849E" stroke-width="0.75" stroke-dasharray="3 7" opacity="0.4"/>

    <!-- Luminous Moon Disc -->
    <circle cx="0" cy="0" r="34" fill="url(#lunarOrb)"/>
    
    <!-- Gentle Shadow Phase (Creating a soft crescent effect) -->
    <path d="M 0 -34 A 34 34 0 0 1 34 0 A 34 34 0 0 1 0 34 A 34 34 0 0 0 14 0 A 34 34 0 0 0 0 -34 Z" 
          fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Center Typography with Needlemac's Poetry & Serenity -->
  <g text-anchor="middle">
    <!-- Subtitle Pill / Eyebrow -->
    <text x="550" y="215" class="tagline-sans">The Lunar Org</text>

    <!-- Main Elegant Italic Heading -->
    <text x="550" y="265" class="title-serif">Software for the quiet hours</text>

    <!-- Fine Dividing Line -->
    <line x1="430" y1="288" x2="670" y2="288" stroke="url(#softBorder)" stroke-width="1"/>

    <!-- Subtle Subtext -->
    <text x="550" y="314" class="motto-serif">Crafted with care, curiosity, and quiet intent.</text>
  </g>
</svg>
