<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0F"/>
      <stop offset="50%" stop-color="#0D111A"/>
      <stop offset="100%" stop-color="#080A0F"/>
    </linearGradient>

    <!-- Ambient Moon Glow -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8BB4D9" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#587999" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0D111A" stop-opacity="0"/>
    </radialGradient>

    <!-- Moon Body Gradient -->
    <linearGradient id="moonSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2EDF8"/>
      <stop offset="60%" stop-color="#A5C1DC"/>
      <stop offset="100%" stop-color="#5B7693"/>
    </linearGradient>

    <!-- Subtle border highlight -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E2638" stop-opacity="0"/>
      <stop offset="50%" stop-color="#587999" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1E2638" stop-opacity="0"/>
    </linearGradient>

    <!-- Filter for soft blur -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="920" height="220" rx="16" fill="url(#bgGrad)"/>
  <rect width="920" height="220" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Ambient Glow Behind Moon -->
  <circle cx="140" cy="110" r="95" fill="url(#moonGlow)"/>

  <!-- Distant Subtle Stars -->
  <g fill="#A5C1DC" opacity="0.4">
    <circle cx="320" cy="45" r="1"/>
    <circle cx="480" cy="35" r="1.5" opacity="0.6"/>
    <circle cx="680" cy="55" r="1"/>
    <circle cx="830" cy="40" r="1.5" opacity="0.7"/>
    <circle cx="280" cy="165" r="1"/>
    <circle cx="560" cy="180" r="1.2"/>
    <circle cx="750" cy="150" r="1"/>
    <circle cx="860" cy="175" r="1.5" opacity="0.5"/>
    <circle cx="420" cy="190" r="0.8"/>
  </g>

  <!-- Serene Moon Crescent & Disc -->
  <g transform="translate(140, 110)">
    <!-- Base Moon Disc (Dark Side) -->
    <circle cx="0" cy="0" r="44" fill="#131A26" stroke="#253247" stroke-width="1.5"/>

    <!-- Soft Crater Highlights on dark side -->
    <circle cx="-12" cy="-10" r="9" fill="#192231" opacity="0.7"/>
    <circle cx="8" cy="14" r="14" fill="#18212F" opacity="0.6"/>
    <circle cx="-15" cy="18" r="6" fill="#192231" opacity="0.5"/>

    <!-- Glowing Crescent -->
    <path d="M 0 -44 A 44 44 0 0 1 44 0 A 44 44 0 0 1 0 44 A 44 44 0 0 0 22 0 A 44 44 0 0 0 0 -44 Z"
          fill="url(#moonSurface)" filter="url(#softGlow)"/>

    <!-- Orbit Ring Line -->
    <ellipse cx="0" cy="0" rx="64" ry="18" fill="none" stroke="#4A6585" stroke-width="1" stroke-dasharray="4 6" opacity="0.5" transform="rotate(-24)"/>
  </g>

  <!-- Typography & Copy -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif">
    <!-- Subtitle / Eyebrow -->
    <text x="240" y="82" fill="#7E95AD" font-size="11" font-weight="600" letter-spacing="4" text-transform="uppercase">
      AN INDEPENDENT ENGINEERING COLLECTIVE
    </text>

    <!-- Main Title -->
    <text x="240" y="122" fill="#F0F4F8" font-size="32" font-weight="700" letter-spacing="3.5">
      THE LUNAR ORG
    </text>

    <!-- Tagline / Mantra -->
    <text x="240" y="154" fill="#94A6B8" font-size="14" font-weight="400" letter-spacing="0.5">
      Quiet craftsmanship, purposeful code, zero clutter.
    </text>

    <!-- Subtle Dots / Status Pill -->
    <g transform="translate(740, 36)">
      <rect width="136" height="26" rx="13" fill="#141B26" stroke="#26354A" stroke-width="1"/>
      <circle cx="16" cy="13" r="3.5" fill="#58D68D"/>
      <text x="28" y="17" fill="#A8BACD" font-size="10.5" font-weight="500" letter-spacing="0.8">SYSTEMS CALM</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <path d="M 120 219 L 800 219" stroke="url(#borderGrad)" stroke-width="1"/>
</svg>
